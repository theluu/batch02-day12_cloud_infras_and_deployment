# ============================================================
# CI/CD Pipeline — Day 12 Bonus
#
# CI (mọi push + PR):  lint (ruff) → unit tests + coverage ≥80%
# CD (chỉ push main):  CI pass → deploy lên Railway
#
# Secret cần thiết (Settings → Secrets → Actions):
#   RAILWAY_TOKEN — project token tạo trên Railway dashboard
# ============================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: my-production-agent

jobs:
  # ──────────────────────────────────────
  # CI — Verify code
  # ──────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app tests --output-format=github

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: my-production-agent/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage (fail under 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: my-production-agent/coverage.xml

  # ──────────────────────────────────────
  # CD — Deploy to Railway (chỉ khi CI pass trên main)
  # ──────────────────────────────────────
  deploy:
    name: Deploy to Railway
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        run: railway up --service my-production-agent --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Smoke test public URL
        run: |
          sleep 45  # chờ deployment chuyển traffic
          URL=https://my-production-agent-production.up.railway.app
          curl -sf $URL/health
          code=$(curl -s -o /dev/null -w "%{http_code}" $URL/ask -X POST \
            -H "Content-Type: application/json" -d '{"question":"ci"}')
          test "$code" = "401" && echo "Auth guard OK (401 without key)"
