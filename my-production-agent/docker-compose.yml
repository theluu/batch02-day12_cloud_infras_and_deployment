# Full production stack: 3 agent instances + Redis + Nginx LB
# Chạy: docker compose up -d --build --scale agent=3
services:

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - RATE_LIMIT_PER_MINUTE=10
      - MONTHLY_BUDGET_USD=10
    env_file:
      - .env            # AGENT_API_KEY — không commit
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - internal

volumes:
  redis_data:

networks:
  internal:
    driver: bridge
